<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdPulse Network</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7fe; color: #333; text-align: center; padding: 40px 20px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #0066cc; margin-bottom: 10px; font-size: 28px; }
        p { color: #666; font-size: 16px; margin-bottom: 20px; }
        .badge { display: inline-block; background: #e1f5fe; color: #0288d1; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>AdPulse Network</h1>
        <p>आपका एड नेटवर्क प्लेटफ़ॉर्म सफलतापूर्वक लाइव हो गया है!</p>
        <div class="badge">Status: Server Online</div>
    </div>
</body>
</html>
